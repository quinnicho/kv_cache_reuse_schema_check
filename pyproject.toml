[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quinnicho-kv_cache_reuse_schema_check"
version = "0.1.0"
description = "从样本里推断模型服务可观测性工程师·KV Cache 复用与前缀共享应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "quinnicho" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://quinnicho.github.io"
Repository = "https://github.com/quinnicho/kv_cache_reuse_schema_check"
Issues = "https://github.com/quinnicho/kv_cache_reuse_schema_check/issues"

[project.scripts]
kv_cache_reuse_schema_check = "kv_cache_reuse_schema_check:main"

[tool.setuptools]
py-modules = ["kv_cache_reuse_schema_check"]
